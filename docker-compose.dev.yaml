services:
  app:
    container_name: php-db-boilerplate
    build: .
    ports:
      - "8080:80"
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: php-boilerplate-db
      DB_USER: app
      DB_PASS: app
    volumes:
      - ./app/public:/var/www/app/public
      - ./app/inc:/var/www/app/inc
    depends_on:
      - mariadb

  mariadb:
    container_name: php-db-boilerplate-mariadb
    image: mariadb:12.1
    ports:
      - "3306:3306"
    environment:
      MARIADB_DATABASE: php-boilerplate-db
      MARIADB_USER: app
      MARIADB_PASSWORD: app
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - mariadb-data:/var/lib/mysql

volumes:
  mariadb-data:
